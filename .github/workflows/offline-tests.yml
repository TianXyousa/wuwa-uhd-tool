name: Offline acceptance tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline fixture tests
        run: python main.py --self-test --report test-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-report
          path: test-report.json
